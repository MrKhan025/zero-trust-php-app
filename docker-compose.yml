version: "3.9"

services:
  zerotrust-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerotrust-php-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./storage:/var/www/zerotrust/storage:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  zerotrust-gateway:
    image: nginx:1.27-alpine
    container_name: zerotrust-nginx
    restart: unless-stopped
    ports:
      - "8443:8080"
    volumes:
      - ./public:/var/www/zerotrust/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zerotrust-app
    security_opt:
      - no-new-privileges:true
