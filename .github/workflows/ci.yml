name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    name: Security Tests & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sodium, openssl, mbstring, json, redis
          coverage: none
          tools: composer
        env:
          fail-fast: true

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate test keys & run adversarial security suite
        run: |
          cp .env.example .env
          php bin/verify-ledger.php --generate-keys
          php tests/SecurityTest.php

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=512M --error-format=github
        continue-on-error: false

      - name: Verify audit ledger CLI
        run: php bin/verify-ledger.php

      - name: Clean up old failed workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion == "failure") | .id' \
            | xargs -r -n1 -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/runs/{}" || true
