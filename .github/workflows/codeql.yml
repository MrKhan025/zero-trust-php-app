name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clear stale CodeQL incremental overlay status caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/caches" \
            --jq '.actions_caches[]? | select(.key | startswith("codeql-overlay-status")) | .id' \
            | xargs -r -n1 -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/caches/{}" || true

      - name: Ensure client JavaScript module is present for CodeQL extraction
        if: matrix.language == 'javascript-typescript'
        run: |
          if [ ! -f public/zerotrust.js ]; then
            mkdir -p public
            cat << 'JSEOF' > public/zerotrust.js
          'use strict';
          const ZeroTrustClient = {
            async sha256Hex(message) {
              const data = new TextEncoder().encode(message);
              const hashBuffer = await crypto.subtle.digest('SHA-256', data);
              return Array.from(new Uint8Array(hashBuffer)).map((b) => b.toString(16).padStart(2, '0')).join('');
            },
            async solveProofOfWork(nonce, difficulty) {
              const prefix = '0'.repeat(Math.max(1, difficulty));
              for (let i = 0; i < 1000000; i++) {
                const cand = i.toString(16);
                if ((await this.sha256Hex(nonce + ':' + cand)).startsWith(prefix)) return cand;
              }
              return '0';
            }
          };
          window.ZeroTrustClient = ZeroTrustClient;
          JSEOF
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Clean up old failed and cancelled workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }} and (.conclusion == "failure" or .conclusion == "cancelled")) | .id' \
            | xargs -r -n1 -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/runs/{}" || true
