name: Publish Docker Container Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-ghcr:
    name: Build & Push Hardened PHP 8.5 Image to GHCR
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry (ghcr.io)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & Push Docker image
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.ref_name }}"
          docker build -t "${IMAGE_REPO}:latest" -t "${IMAGE_REPO}:${TAG}" .
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${TAG}"
